<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="C3 Remote">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon.png">
  <title>C3 Remote</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      color: #f4f6f8;
      background: #111318;
      font-synthesis: none;
      --bg: #111318;
      --bar: #1a1e26;
      --panel: #1b1f27;
      --panel-pressed: #242a34;
      --line: #6e7684;
      --text: #f4f6f8;
      --muted: #a8b0bc;
      --faint: #737b88;
      --blue: #71b7ef;
      --yellow: #ffc107;
      --red: #ff6b6b;
      --green: #75d29a;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: var(--bg); }
    body { overscroll-behavior-y: none; }
    button, textarea, input { font: inherit; }
    button { color: inherit; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    [hidden] { display: none !important; }

    .app-shell { min-height: 100dvh; }
    .topbar {
      min-height: calc(58px + var(--safe-top));
      padding: calc(10px + var(--safe-top)) 16px 10px;
      display: flex;
      align-items: center;
      gap: 11px;
      background: var(--bar);
      border-bottom: 1px solid #252b35;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand-mark { width: 31px; height: 31px; border-radius: 7px; }
    .brand-name { font-size: 21px; font-weight: 760; letter-spacing: -0.025em; }
    .connection {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 44px;
      padding: 0 2px 0 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }
    .connection-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
    .connection.online .connection-dot { background: var(--green); }
    .connection.offline .connection-dot { background: var(--red); }
    .topbar-new-agent {
      min-height: 44px;
      padding: 0 11px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #4a5260;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
    }
    .topbar-new-agent svg { color: var(--blue); }

    main { width: min(920px, 100%); margin: 0 auto; padding: 19px 14px calc(30px + var(--safe-bottom)); }
    .board-heading { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 15px; }
    .board-heading h1 { margin: 0; font-size: 17px; font-weight: 540; letter-spacing: -0.01em; }
    .updated { color: var(--muted); font-size: 12px; }
    .session-search {
      position: relative;
      margin: 0 0 13px;
    }
    .session-search svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--faint);
      pointer-events: none;
    }
    .session-search input {
      width: 100%;
      min-height: 44px;
      padding: 9px 12px 9px 38px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel);
      color: var(--text);
      appearance: none;
    }
    .session-search input::placeholder { color: var(--muted); }
    .session-search input:focus { border-color: var(--blue); outline: none; }
    .view-switch {
      margin-bottom: 13px;
      padding: 3px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid #4a5260;
      border-radius: 8px;
      background: #0d0f14;
    }
    .view-switch button {
      min-height: 44px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 720;
      cursor: pointer;
    }
    .view-switch button.active { background: var(--panel-pressed); color: var(--text); }
    .session-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .session-card {
      position: relative;
      min-width: 0;
      min-height: 174px;
      padding: 15px 15px 13px;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 3px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .22);
      cursor: pointer;
      transition: background 120ms ease-out, border-color 120ms ease-out;
    }
    .session-card:hover { border-color: #929aa7; }
    .session-card:active { background: var(--panel-pressed); }
    .state-light { position: absolute; width: 9px; height: 9px; border-radius: 50%; top: 10px; right: 10px; background: var(--faint); }
    .state-light.processing, .state-light.spawning { background: var(--blue); }
    .state-light.awaiting_input, .state-light.complete { background: var(--yellow); }
    .state-light.awaiting_permission, .state-light.error { background: var(--red); }
    .session-name { margin: 0 24px 4px 0; font-size: 18px; line-height: 1.18; font-weight: 780; letter-spacing: -0.022em; overflow-wrap: anywhere; }
    .session-task { min-height: 39px; margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .state-label { margin: 0 0 6px; color: #9da5b1; font-size: 12px; font-weight: 780; letter-spacing: .065em; }
    .attention { margin: 0; color: var(--text); font-size: 15px; line-height: 1.32; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .agent-kind { margin-top: 13px; color: #8f98a5; font-size: 12px; text-transform: lowercase; }
    .group-list { display: grid; gap: 22px; }
    .group-section { min-width: 0; }
    .group-heading {
      min-height: 30px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 14px;
      font-weight: 760;
    }
    .group-color { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
    .group-count { margin-left: auto; color: var(--muted); font-size: 11px; font-weight: 550; }
    .group-session-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .empty-group {
      padding: 18px 12px;
      border: 1px dashed #4a5260;
      border-radius: 5px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .empty, .error-panel { padding: 54px 24px; text-align: center; color: var(--muted); }
    .empty strong, .error-panel strong { display: block; margin-bottom: 7px; color: var(--text); font-size: 18px; }

    .detail { height: calc(100dvh - 96px - var(--safe-top) - var(--safe-bottom)); min-height: 0; display: flex; flex-direction: column; }
    .detail-header { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
    .back-button, .icon-button {
      min-width: 44px;
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      display: inline-grid;
      place-items: center;
      cursor: pointer;
    }
    .back-button:hover, .icon-button:hover { background: var(--panel); }
    .detail-title { min-width: 0; flex: 1; }
    .detail-title h1 { margin: 0; font-size: 18px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .detail-meta { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .live-mode-button {
      min-height: 44px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .live-mode-button.active {
      border-color: rgba(117, 210, 154, .48);
      color: var(--green);
      background: rgba(117, 210, 154, .08);
    }
    .live-mode-button.fallback {
      border-color: rgba(255, 193, 7, .48);
      color: var(--yellow);
      background: rgba(255, 193, 7, .08);
    }
    .live-mode-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .terminal {
      flex: 1 1 auto;
      min-height: 0;
      margin: 0;
      padding: 14px;
      overflow: auto;
      border: 1px solid #3d4550;
      border-radius: 4px;
      background: #0b0d11;
      color: #dce2e8;
      font: 11.5px/1.48 ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      tab-size: 2;
    }
    .terminal.loading { color: var(--faint); }
    .terminal-line { min-height: 1.48em; }
    .terminal-span.dim { opacity: 0.62; }
    .composer {
      position: sticky;
      bottom: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 9px;
      padding: 12px 0 max(2px, var(--safe-bottom));
      background: linear-gradient(to bottom, rgba(17,19,24,0), var(--bg) 12px);
    }
    .composer textarea {
      width: 100%;
      min-height: 48px;
      max-height: 150px;
      resize: none;
      padding: 12px 13px;
      border: 1px solid #59616e;
      border-radius: 9px;
      background: var(--panel);
      color: var(--text);
      line-height: 1.35;
    }
    .composer textarea::placeholder { color: #858e9b; }
    .send-button {
      min-width: 58px;
      min-height: 48px;
      align-self: end;
      border: 0;
      border-radius: 9px;
      background: var(--blue);
      color: #07131c;
      font-weight: 780;
      cursor: pointer;
    }
    .send-button:disabled { background: #47505c; color: #8c95a1; cursor: default; }
    .send-status { grid-column: 1 / -1; min-height: 18px; color: var(--muted); font-size: 12px; }
    .send-status.error { color: #ff9898; }

    .pairing {
      min-height: 100dvh;
      padding: calc(44px + var(--safe-top)) 22px calc(30px + var(--safe-bottom));
      display: grid;
      align-content: center;
      max-width: 480px;
      margin: 0 auto;
    }
    .pairing img { width: 54px; height: 54px; border-radius: 12px; margin-bottom: 23px; }
    .pairing h1 { margin: 0 0 10px; font-size: 29px; letter-spacing: -0.035em; }
    .pairing p { margin: 0 0 23px; color: var(--muted); line-height: 1.5; }
    .pairing input { min-height: 50px; padding: 0 13px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); }
    .pairing button { min-height: 50px; margin-top: 10px; border: 0; border-radius: 8px; background: var(--blue); color: #07131c; font-weight: 780; }
    .pairing-error { min-height: 19px; margin-top: 10px; color: #ff9898; font-size: 13px; }

    @media (max-width: 360px) {
      .session-grid, .group-session-grid { grid-template-columns: 1fr; }
      main { padding-inline: 10px; }
    }
    @media (min-width: 700px) {
      main { padding: 25px 24px 40px; }
      .session-grid, .group-session-grid { gap: 14px; }
      .session-card { min-height: 190px; padding: 18px; }
    }
    .launch-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      align-items: end;
      background: rgba(0, 0, 0, .68);
    }
    .launch-sheet {
      width: min(620px, 100%);
      max-height: min(88dvh, 760px);
      margin: 0 auto;
      padding: 18px 16px calc(18px + var(--safe-bottom));
      overflow: auto;
      border: 1px solid #4a5260;
      border-bottom: 0;
      border-radius: 14px 14px 0 0;
      background: var(--bar);
      box-shadow: 0 -12px 40px rgba(0, 0, 0, .45);
    }
    .launch-header { display: flex; align-items: center; gap: 12px; margin-bottom: 17px; }
    .launch-header h2 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
    .launch-close { margin-left: auto; }
    .launch-field { margin-top: 15px; }
    .launch-field > label, .launch-field > span {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }
    .agent-picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .agent-picker button {
      min-height: 44px;
      border: 1px solid #4a5260;
      border-radius: 7px;
      background: var(--panel);
      color: var(--muted);
      font-weight: 700;
    }
    .agent-picker button.active { border-color: var(--blue); color: var(--text); background: var(--panel-pressed); }
    .launch-field input, .launch-field textarea {
      width: 100%;
      border: 1px solid #4a5260;
      border-radius: 7px;
      background: #11141a;
      color: var(--text);
    }
    .launch-field input { min-height: 44px; padding: 0 11px; }
    .launch-field textarea { min-height: 78px; padding: 10px 11px; resize: vertical; }
    .project-list {
      max-height: 260px;
      margin-top: 7px;
      overflow: auto;
      border: 1px solid #363d48;
      border-radius: 7px;
    }
    .project-option {
      width: 100%;
      min-height: 49px;
      padding: 7px 10px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      text-align: left;
      border: 0;
      border-bottom: 1px solid #2c323c;
      background: transparent;
      color: var(--text);
    }
    .project-option:last-child { border-bottom: 0; }
    .project-option.active { background: rgba(113, 183, 239, .12); }
    .project-option strong, .project-option small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .project-option small { grid-column: 1; margin-top: 2px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; }
    .project-option em { grid-column: 2; grid-row: 1 / span 2; align-self: center; color: var(--green); font-size: 10px; font-style: normal; }
    .launch-error { min-height: 18px; margin-top: 9px; color: #ff9898; font-size: 12px; }
    .launch-submit {
      width: 100%;
      min-height: 48px;
      margin-top: 13px;
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      color: #07131c;
      font-weight: 800;
    }
    .launch-submit:disabled { background: #47505c; color: #8c95a1; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <!--
  THESIS: C3 Remote is an attention board, not a desktop dashboard compressed onto a phone.
  OWN-WORLD: near-black field, graphite session tiles, cool-blue activity, amber attention, and one-pixel operational rules.
  STORY: scan every agent, open the one that needs attention, read its pane, and return one response.
  FIRST VIEWPORT: compact C3 bar, agent count, then at most two columns of sessions; the response action lives only inside detail.
  FORM: restrained mobile operations board pinned by the supplied k-stack reference; seed key user-reference.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
  -->
  <section id="pairing" class="pairing" hidden>
    <img src="/icon.png" alt="">
    <h1>Connect to C3</h1>
    <p>Paste the pairing link from C3 Settings on your Mac. Keep Tailscale connected on both devices.</p>
    <input id="pairing-input" type="url" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" placeholder="http://100.x.x.x:9399/#token=…" aria-label="C3 pairing link">
    <button id="pairing-button" type="button">Connect</button>
    <div id="pairing-error" class="pairing-error" role="alert"></div>
  </section>

  <div id="app" class="app-shell" hidden>
    <header class="topbar">
      <img class="brand-mark" src="/icon.png" alt="">
      <div class="brand-name">C3 Remote</div>
      <div id="connection" class="connection" aria-live="polite">
        <span class="connection-dot"></span><span id="connection-label">Connecting</span>
      </div>
      <button id="new-agent-button" class="topbar-new-agent" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>New</span>
      </button>
    </header>

    <main>
      <section id="board">
        <div class="board-heading">
          <h1 id="agent-count">Agents</h1>
          <span id="updated" class="updated"></span>
        </div>
        <label class="session-search">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="session-search" type="search" autocomplete="off" autocapitalize="off" placeholder="Search agents" aria-label="Search agents">
        </label>
        <div class="view-switch" role="group" aria-label="Session view">
          <button id="attention-view-button" class="active" type="button" aria-pressed="true">Attention</button>
          <button id="groups-view-button" type="button" aria-pressed="false">Groups</button>
        </div>
        <div id="session-grid" class="session-grid"></div>
        <div id="board-empty" class="empty" hidden><strong>No agent panes</strong>C3 will add sessions when an agent starts in tmux.</div>
      </section>

      <section id="detail" class="detail" aria-labelledby="detail-name" tabindex="-1" hidden>
        <div class="detail-header">
          <button id="back-button" class="back-button" type="button" aria-label="Back to agents">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="detail-title">
            <h1 id="detail-name">Session</h1>
            <div id="detail-meta" class="detail-meta"></div>
          </div>
          <button id="live-button" class="live-mode-button fallback" type="button" aria-pressed="true" aria-label="Live updates" aria-description="Polling while the live stream connects">
            <span class="live-mode-dot" aria-hidden="true"></span>
            <span id="live-button-label">Live</span>
          </button>
          <button id="refresh-button" class="icon-button" type="button" aria-label="Refresh pane">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/></svg>
          </button>
        </div>
        <div id="terminal" class="terminal loading" role="region" aria-label="Tmux pane output" tabindex="0">Loading pane…</div>
        <form id="composer" class="composer">
          <textarea id="response" rows="1" maxlength="65536" placeholder="Type or dictate a response" aria-label="Response"></textarea>
          <button id="send-button" class="send-button" type="submit" disabled>Send</button>
          <div id="send-status" class="send-status" role="status"></div>
        </form>
      </section>
    </main>
  </div>

  <div id="launch-overlay" class="launch-overlay" role="dialog" aria-modal="true" aria-labelledby="launch-title" hidden>
    <form id="launch-form" class="launch-sheet" aria-busy="false">
      <div class="launch-header">
        <h2 id="launch-title">Start an agent</h2>
        <button id="launch-close" class="icon-button launch-close" type="button" aria-label="Close new agent">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="launch-field">
        <span>Agent</span>
        <div class="agent-picker" role="radiogroup" aria-label="Agent">
          <button type="button" data-agent="omp" class="active" role="radio" aria-checked="true">OMP</button>
          <button type="button" data-agent="claude" role="radio" aria-checked="false">Claude</button>
          <button type="button" data-agent="codex" role="radio" aria-checked="false">Codex</button>
        </div>
      </div>
      <div class="launch-field">
        <label for="project-search">Project</label>
        <input id="project-search" type="search" autocomplete="off" placeholder="Search configured projects">
        <div id="project-list" class="project-list" role="group" aria-label="Projects" aria-busy="false"></div>
      </div>
      <div class="launch-field">
        <label for="launch-prompt">Initial prompt <span class="updated">(optional)</span></label>
        <textarea id="launch-prompt" maxlength="16384" placeholder="What should the agent work on?"></textarea>
      </div>
      <div id="launch-error" class="launch-error" role="alert"></div>
      <button id="launch-submit" class="launch-submit" type="submit" disabled>Start agent</button>
    </form>
  </div>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const state = {
        token: '',
        sessions: [],
        sessionMeta: {},
        groups: [],
        boardMode: 'attention',
        projects: [],
        selectedProjectPath: '',
        launchAgent: 'omp',
        projectQuery: '',
        launching: false,
        boardFingerprint: '',
        searchQuery: '',
        selectedId: null,
        returnFocusSessionId: null,
        paneRevision: '',
        paneRequestSerial: 0,
        liveStreaming: true,
        streamActive: false,
        streamAbort: null,
        streamRetryTimer: null,
        streamFailures: 0,
        boardTimer: null,
        paneTimer: null,
      };
      const attentionOrder = { awaiting_permission: 0, awaiting_input: 1, processing: 2, spawning: 2, error: 3, complete: 4 };
      const stateLabel = (value) => ({
        awaiting_permission: 'PERMISSION', awaiting_input: 'NEEDS INPUT', processing: 'WORKING',
        spawning: 'STARTING', complete: 'IDLE', error: 'ERROR'
      })[value] || value.toUpperCase();
      const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);

      const maximumStreamEventCharacters = 8 * 1024 * 1024;

      function extractToken(value) {
        try {
          const url = new URL(value, window.location.href);
          const hash = new URLSearchParams(url.hash.replace(/^#/, ''));
          return hash.get('token') || '';
        } catch { return ''; }
      }

      function bootstrapToken() {
        const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        const incoming = hash.get('token');
        if (incoming) {
          localStorage.setItem('c3.remote.token', incoming);
          history.replaceState({}, '', window.location.pathname);
        }
        state.token = incoming || localStorage.getItem('c3.remote.token') || '';
        $('pairing').hidden = Boolean(state.token);
        $('app').hidden = !state.token;
      }

      function rejectPairing() {
        localStorage.removeItem('c3.remote.token');
        state.token = '';
        state.liveStreaming = false;
        stopPaneUpdates();
        closeLaunchSheet(true);
        $('app').hidden = true;
        $('pairing').hidden = false;
        $('pairing-error').textContent = 'Pairing expired. Paste a fresh C3 pairing link.';
      }

      async function api(path, options = {}) {
        const headers = new Headers(options.headers || {});
        headers.set('Authorization', `Bearer ${state.token}`);
        if (options.body) headers.set('Content-Type', 'application/json');
        const response = await fetch(path, { ...options, headers, cache: 'no-store' });
        if (response.status === 401) {
          rejectPairing();
          throw new Error('The access token was rejected. Paste a fresh pairing link.');
        }
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || `C3 returned ${response.status}`);
        return payload;
      }

      function setConnection(kind, label) {
        const className = `connection ${kind}`;
        if ($('connection').className === className && $('connection-label').textContent === label) {
          return;
        }
        $('connection').className = className;
        $('connection-label').textContent = label;
      }

      function displayName(session) {
        return session.projectName.replace(/^[⠀-⣿>!]\s*/, '');
      }

      function sessionSummary(session) {
        if (!session.projectPath) return `${session.agentKind || 'agent'} session`;
        const parts = session.projectPath.split('/').filter(Boolean);
        return parts.at(-1) || session.projectPath;
      }

      function renderSessionCard(session) {
        return `
          <button class="session-card" type="button" data-session-id="${escapeHtml(session.id)}">
            <span class="state-light ${escapeHtml(session.state)}" aria-hidden="true"></span>
            <h2 class="session-name">${escapeHtml(displayName(session))}</h2>
            <p class="session-task">${escapeHtml(sessionSummary(session))}</p>
            <div class="state-label">${escapeHtml(stateLabel(session.state))}</div>
            <p class="attention">${escapeHtml(session.pendingAction?.description || (session.state === 'processing' ? 'Agent is working' : 'Review the latest pane output'))}</p>
            <div class="agent-kind">${escapeHtml(session.agentKind || 'agent')}</div>
          </button>`;
      }

      function filteredSessions() {
        const query = state.searchQuery.trim().toLowerCase();
        const ordered = [...state.sessions].sort((a, b) => {
          const priority = (attentionOrder[a.state] ?? 9) - (attentionOrder[b.state] ?? 9);
          return priority || new Date(b.lastActivity) - new Date(a.lastActivity);
        });
        if (!query) return ordered;
        return ordered.filter((session) => [
          displayName(session),
          session.projectPath,
          session.agentKind,
          session.pendingAction?.description,
        ].some((value) => String(value || '').toLowerCase().includes(query)));
      }

      function renderGroupSection(id, name, color, sessions, hasQuery) {
        const safeColor = /^#[0-9a-f]{6}$/i.test(color || '') ? color : 'var(--faint)';
        const headingId = `group-heading-${id}`;
        const content = sessions.length
          ? `<div class="group-session-grid">${sessions.map(renderSessionCard).join('')}</div>`
          : `<div class="empty-group">${hasQuery ? 'No matching agents' : 'No agents'}</div>`;
        return `
          <section class="group-section" aria-labelledby="${headingId}">
            <h2 class="group-heading" id="${headingId}">
              <span class="group-color" style="background:${safeColor}" aria-hidden="true"></span>
              <span>${escapeHtml(name)}</span>
              <span class="group-count">${sessions.length}</span>
            </h2>
            ${content}
          </section>`;
      }

      function renderBoard() {
        const focusedSessionId = document.activeElement?.dataset?.sessionId || null;
        const sessions = filteredSessions();
        const hasQuery = Boolean(state.searchQuery.trim());
        $('agent-count').textContent = hasQuery
          ? `${sessions.length} of ${state.sessions.length} agents`
          : `${sessions.length} ${sessions.length === 1 ? 'agent' : 'agents'}`;
        $('attention-view-button').classList.toggle('active', state.boardMode === 'attention');
        $('groups-view-button').classList.toggle('active', state.boardMode === 'groups');
        $('attention-view-button').setAttribute('aria-pressed', String(state.boardMode === 'attention'));
        $('groups-view-button').setAttribute('aria-pressed', String(state.boardMode === 'groups'));

        $('board-empty').hidden = sessions.length > 0;
        $('board-empty').innerHTML = state.sessions.length
          ? '<strong>No matching agents</strong>Try another project, task, or agent name.'
          : '<strong>No agent panes</strong>C3 will add sessions when an agent starts in tmux.';

        if (state.boardMode === 'attention') {
          $('session-grid').className = 'session-grid';
          $('session-grid').innerHTML = sessions.map(renderSessionCard).join('');
        } else {
          $('session-grid').className = 'group-list';
          if (!sessions.length) {
            $('session-grid').innerHTML = '';
          } else {
            const knownGroupIds = new Set(state.groups.map((group) => group.id));
            const sections = state.groups.map((group, index) => {
              const groupSessions = sessions.filter(
                (session) => state.sessionMeta[session.id]?.groupId === group.id
              );
              if (hasQuery && !groupSessions.length) return '';
              return renderGroupSection(`configured-${index}`, group.name, group.color, groupSessions, hasQuery);
            }).filter(Boolean);
            const ungrouped = sessions.filter((session) => {
              const groupId = state.sessionMeta[session.id]?.groupId;
              return !groupId || !knownGroupIds.has(groupId);
            });
            if (ungrouped.length || (!hasQuery && state.groups.length === 0)) {
              sections.push(renderGroupSection('ungrouped', 'Ungrouped', '#737b88', ungrouped, hasQuery));
            }
            $('session-grid').innerHTML = sections.join('');
          }
        }

        document.querySelectorAll('[data-session-id]').forEach((card) => {
          card.addEventListener('click', () => openDetail(card.dataset.sessionId));
        });
        if (focusedSessionId) {
          document.querySelector(`[data-session-id="${CSS.escape(focusedSessionId)}"]`)?.focus({ preventScroll: true });
        }
      }

      async function refreshBoard() {
        try {
          const dashboard = await api('/api/dashboard');
          const fingerprint = JSON.stringify(dashboard);
          state.sessions = dashboard.sessions || [];
          state.sessionMeta = dashboard.sessionMeta?.sessions || {};
          state.groups = dashboard.sessionMeta?.groups || [];
          if (fingerprint !== state.boardFingerprint) {
            state.boardFingerprint = fingerprint;
            renderBoard();
          }
          if (!state.selectedId) setConnection('online', 'Connected');
          $('updated').textContent = 'now';
        } catch (error) {
          if (!state.selectedId) setConnection('offline', 'Offline');
          $('updated').textContent = '';
          if (!state.sessions.length && state.token) {
            $('session-grid').innerHTML = `<div class="error-panel"><strong>Could not reach C3</strong>${escapeHtml(error.message)}</div>`;
          }
        }
      }

      function projectMatchesQuery(project) {
        const query = state.projectQuery.trim().toLowerCase();
        return !query || `${project.name}\n${project.path}`.toLowerCase().includes(query);
      }

      function renderProjects() {
        const projects = state.projects.filter(projectMatchesQuery).slice(0, 100);
        const selectedVisible = projects.some((project) => project.path === state.selectedProjectPath);
        $('launch-submit').disabled = state.launching || !selectedVisible;
        $('project-list').setAttribute('aria-busy', 'false');
        $('project-list').innerHTML = projects.length
          ? projects.map((project) => `
              <button
                class="project-option ${state.selectedProjectPath === project.path ? 'active' : ''}"
                type="button"
                aria-pressed="${state.selectedProjectPath === project.path}"
                data-project-path="${escapeHtml(project.path)}"
                ${state.launching ? 'disabled' : ''}
              >
                <strong>${escapeHtml(project.name)}</strong>
                <small>${escapeHtml(project.path)}</small>
                ${project.active ? '<em>active</em>' : ''}
              </button>`).join('')
          : '<div class="empty-group" role="status">No projects match this search.</div>';
        document.querySelectorAll('[data-project-path]').forEach((button) => {
          button.addEventListener('click', () => {
            if (state.launching) return;
            state.selectedProjectPath = button.dataset.projectPath;
            renderProjects();
          });
        });
      }

      async function openLaunchSheet() {
        if (state.launching) return;
        $('launch-overlay').hidden = false;
        $('app').inert = true;
        $('launch-form').setAttribute('aria-busy', 'false');
        $('launch-error').textContent = '';
        $('launch-prompt').value = '';
        $('project-search').value = '';
        state.projectQuery = '';
        state.projects = [];
        state.selectedProjectPath = '';
        $('launch-submit').disabled = true;
        $('project-list').setAttribute('aria-busy', 'true');
        $('project-list').innerHTML = '<div class="empty-group" role="status">Loading projects…</div>';
        $('launch-close').focus();
        try {
          state.projects = await api('/api/projects');
          state.selectedProjectPath = state.projects.find((project) => project.active)?.path
            || state.projects[0]?.path
            || '';
          renderProjects();
          $('project-search').focus();
        } catch (error) {
          $('launch-error').textContent = error.message;
          $('project-list').setAttribute('aria-busy', 'false');
          $('project-list').innerHTML = '<div class="empty-group" role="status">Could not load projects.</div>';
        }
      }

      function closeLaunchSheet(force = false) {
        if (state.launching && !force) return;
        $('launch-overlay').hidden = true;
        $('app').inert = false;
        $('new-agent-button').focus({ preventScroll: true });
      }

      function setLaunchBusy(busy) {
        state.launching = busy;
        $('launch-form').setAttribute('aria-busy', String(busy));
        $('launch-close').disabled = busy;
        $('project-search').disabled = busy;
        $('launch-prompt').disabled = busy;
        document.querySelectorAll('[data-agent]').forEach((button) => { button.disabled = busy; });
        renderProjects();
      }

      function selectLaunchAgent(agent) {
        if (state.launching) return;
        state.launchAgent = agent;
        document.querySelectorAll('[data-agent]').forEach((button) => {
          const selected = button.dataset.agent === agent;
          button.classList.toggle('active', selected);
          button.setAttribute('aria-checked', String(selected));
        });
      }

      async function submitLaunch() {
        const selectedVisible = state.projects.some(
          (project) => project.path === state.selectedProjectPath && projectMatchesQuery(project)
        );
        if (!selectedVisible || state.launching) return;
        setLaunchBusy(true);
        $('launch-submit').textContent = 'Starting…';
        $('launch-error').textContent = '';
        try {
          await api('/api/launch', {
            method: 'POST',
            body: JSON.stringify({
              agentKind: state.launchAgent,
              projectPath: state.selectedProjectPath,
              prompt: $('launch-prompt').value.trim() || null,
            }),
          });
          closeLaunchSheet(true);
          $('updated').textContent = `Started ${state.launchAgent.toUpperCase()}`;
          setTimeout(refreshBoard, 800);
          setTimeout(refreshBoard, 3200);
        } catch (error) {
          $('launch-error').textContent = error.message;
        } finally {
          setLaunchBusy(false);
          $('launch-submit').textContent = 'Start agent';
        }
      }

      function renderStyledCapture(terminal, capture) {
        if (!Array.isArray(capture.styledLines)) {
          terminal.textContent = capture.output || 'Pane is empty.';
          return;
        }
        const colorPattern = /^#[0-9a-f]{6}$/i;
        const fragment = document.createDocumentFragment();
        capture.styledLines.forEach((spans) => {
          const line = document.createElement('div');
          line.className = 'terminal-line';
          if (!spans.length) {
            line.textContent = '\u200b';
          } else {
            spans.forEach((source) => {
              const span = document.createElement('span');
              span.className = `terminal-span${source.dim ? ' dim' : ''}`;
              span.textContent = source.text;
              if (colorPattern.test(source.foreground || '')) span.style.color = source.foreground;
              if (colorPattern.test(source.background || '')) span.style.backgroundColor = source.background;
              if (source.bold) span.style.fontWeight = '700';
              if (source.italic) span.style.fontStyle = 'italic';
              if (source.underline) span.style.textDecoration = 'underline';
              line.appendChild(span);
            });
          }
          fragment.appendChild(line);
        });
        terminal.replaceChildren(fragment);
      }

      function applyPaneCapture(capture, transport = 'poll') {
        if (!state.selectedId || capture.sessionId !== state.selectedId) return false;
        if (transport === 'stream' && !state.streamActive) {
          state.paneRequestSerial += 1;
          state.streamActive = true;
          state.streamFailures = 0;
          updateLiveButton();
        }
        setConnection('online', 'Connected');
        if (capture.revision === state.paneRevision) return false;
        const terminal = $('terminal');
        const nearBottom = terminal.scrollHeight - terminal.scrollTop - terminal.clientHeight < 80;
        state.paneRevision = capture.revision || '';
        renderStyledCapture(terminal, capture);
        terminal.classList.remove('loading');
        if (nearBottom) terminal.scrollTop = terminal.scrollHeight;
        return true;
      }

      async function refreshPane() {
        const requestedSessionId = state.selectedId;
        if (!requestedSessionId) return;
        const requestSerial = ++state.paneRequestSerial;
        try {
          const capture = await api(`/api/capture?sessionId=${encodeURIComponent(requestedSessionId)}`);
          if (state.selectedId !== requestedSessionId || requestSerial !== state.paneRequestSerial) return;
          applyPaneCapture(capture, 'poll');
        } catch (error) {
          if (state.selectedId !== requestedSessionId || requestSerial !== state.paneRequestSerial) return;
          if (!state.paneRevision) {
            $('terminal').textContent = `Could not load pane.\n\n${error.message}`;
            $('terminal').classList.remove('loading');
          }
          setConnection('offline', 'Offline');
        }
      }

      function updateLiveButton() {
        const actualMode = !state.liveStreaming
          ? 'Saver'
          : state.streamActive
            ? 'Live'
            : 'Fallback';
        $('live-button').classList.toggle('active', actualMode === 'Live');
        $('live-button').classList.toggle('fallback', actualMode === 'Fallback');
        $('live-button').setAttribute('aria-label', 'Live updates');
        $('live-button').setAttribute('aria-pressed', String(state.liveStreaming));
        $('live-button').setAttribute(
          'aria-description',
          actualMode === 'Live'
            ? 'Streaming changed pane frames'
            : actualMode === 'Fallback'
              ? 'Polling while the live stream reconnects'
              : 'Battery saver polling every 1.5 seconds'
        );
        $('live-button-label').textContent = actualMode;
        $('refresh-button').hidden = state.liveStreaming;
      }

      function stopPaneUpdates() {
        state.paneRequestSerial += 1;
        state.streamActive = false;
        state.streamAbort?.abort();
        state.streamAbort = null;
        clearTimeout(state.streamRetryTimer);
        state.streamRetryTimer = null;
        clearInterval(state.paneTimer);
        state.paneTimer = null;
      }

      function startSaverPolling() {
        refreshPane();
        state.paneTimer = setInterval(refreshPane, 1500);
      }

      async function startPaneStream() {
        const sessionId = state.selectedId;
        if (!sessionId || !state.liveStreaming) return;
        const controller = new AbortController();
        state.streamAbort = controller;
        try {
          const response = await fetch(`/api/stream?sessionId=${encodeURIComponent(sessionId)}`, {
            headers: { Authorization: `Bearer ${state.token}` },
            cache: 'no-store',
            signal: controller.signal,
          });
          if (response.status === 401) {
            rejectPairing();
            return;
          }
          if (!response.ok || !response.body) {
            const payload = await response.json().catch(() => ({}));
            throw new Error(payload.error || `C3 stream returned ${response.status}`);
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          while (state.selectedId === sessionId && state.liveStreaming) {
            const { value, done } = await reader.read();
            if (done) throw new Error('Live stream closed');
            buffer += decoder.decode(value, { stream: true });
            if (buffer.length > maximumStreamEventCharacters) {
              throw new Error('Live pane frame exceeded 8 MiB');
            }
            let boundary;
            while ((boundary = buffer.indexOf('\n\n')) >= 0) {
              const block = buffer.slice(0, boundary);
              buffer = buffer.slice(boundary + 2);
              if (!block || block.startsWith(':')) continue;
              let eventName = 'message';
              let data = '';
              block.split('\n').forEach((line) => {
                if (line.startsWith('event:')) eventName = line.slice(6).trim();
                if (line.startsWith('data:')) data += line.slice(5).trimStart();
              });
              if (eventName === 'pane' && data) {
                applyPaneCapture(JSON.parse(data), 'stream');
              } else if (eventName === 'error') {
                const payload = JSON.parse(data || '{}');
                throw new Error(payload.error || 'Live stream failed');
              }
            }
          }
        } catch (error) {
          if (controller.signal.aborted || !state.liveStreaming || state.selectedId !== sessionId) return;
          state.streamFailures += 1;
          state.streamActive = false;
          updateLiveButton();
          setConnection('offline', 'Reconnecting');
          startSaverPolling();
          const delay = Math.min(5000, 750 * (2 ** Math.min(state.streamFailures, 3)));
          state.streamRetryTimer = setTimeout(() => {
            clearInterval(state.paneTimer);
            state.paneTimer = null;
            state.paneRequestSerial += 1;
            startPaneStream();
          }, delay);
        } finally {
          if (state.streamAbort === controller) state.streamAbort = null;
        }
      }

      function restartPaneUpdates() {
        stopPaneUpdates();
        if (!state.selectedId) return;
        updateLiveButton();
        if (state.liveStreaming) {
          startPaneStream();
        } else {
          startSaverPolling();
          setConnection('online', 'Connected');
        }
      }

      function openDetail(id) {
        const session = state.sessions.find((item) => item.id === id);
        if (!session) return;
        state.returnFocusSessionId = id;
        state.selectedId = id;
        state.paneRevision = '';
        $('board').hidden = true;
        $('detail').hidden = false;
        $('detail-name').textContent = displayName(session);
        $('detail-meta').textContent = `${session.agentKind || 'agent'} · ${stateLabel(session.state)}`;
        $('terminal').textContent = 'Connecting to live pane…';
        $('terminal').classList.add('loading');
        $('response').value = '';
        $('send-button').disabled = true;
        $('send-status').textContent = '';
        window.scrollTo({ top: 0, behavior: 'instant' });
        history.pushState({ sessionId: id }, '', `#session=${encodeURIComponent(id)}`);
        restartPaneUpdates();
        $('detail').focus({ preventScroll: true });
      }

      function closeDetail(updateHistory = true) {
        const returnFocusSessionId = state.returnFocusSessionId;
        stopPaneUpdates();
        state.selectedId = null;
        state.returnFocusSessionId = null;
        state.paneRevision = '';
        $('detail').hidden = true;
        $('board').hidden = false;
        setConnection('online', 'Connected');
        if (updateHistory) history.pushState({}, '', window.location.pathname);
        const card = returnFocusSessionId
          ? document.querySelector(`[data-session-id="${CSS.escape(returnFocusSessionId)}"]`)
          : null;
        (card || $('session-search')).focus({ preventScroll: true });
      }

      $('pairing-button').addEventListener('click', async () => {
        const token = extractToken($('pairing-input').value);
        if (!token) { $('pairing-error').textContent = 'That link does not contain a C3 access token.'; return; }
        state.token = token;
        localStorage.setItem('c3.remote.token', token);
        $('pairing').hidden = true;
        $('app').hidden = false;
        $('pairing-error').textContent = '';
        await refreshBoard();
        clearInterval(state.boardTimer);
        state.boardTimer = setInterval(refreshBoard, 3000);
      });
      $('back-button').addEventListener('click', () => closeDetail());
      $('refresh-button').addEventListener('click', refreshPane);
      $('live-button').addEventListener('click', () => {
        state.liveStreaming = !state.liveStreaming;
        state.streamFailures = 0;
        restartPaneUpdates();
      });
      $('session-search').addEventListener('input', (event) => {
        state.searchQuery = event.target.value;
        renderBoard();
      });
      $('attention-view-button').addEventListener('click', () => {
        state.boardMode = 'attention';
        renderBoard();
      });
      $('groups-view-button').addEventListener('click', () => {
        state.boardMode = 'groups';
        renderBoard();
      });
      $('new-agent-button').addEventListener('click', openLaunchSheet);
      $('launch-close').addEventListener('click', closeLaunchSheet);
      $('launch-overlay').addEventListener('click', (event) => {
        if (event.target === $('launch-overlay')) closeLaunchSheet();
      });
      document.querySelectorAll('[data-agent]').forEach((button) => {
        button.addEventListener('click', () => selectLaunchAgent(button.dataset.agent));
      });
      $('project-search').addEventListener('input', (event) => {
        state.projectQuery = event.target.value;
        if (!state.projects.some(
          (project) => project.path === state.selectedProjectPath && projectMatchesQuery(project)
        )) {
          state.selectedProjectPath = '';
        }
        renderProjects();
      });
      $('launch-form').addEventListener('submit', (event) => {
        event.preventDefault();
        submitLaunch();
      });
      $('response').addEventListener('input', (event) => { $('send-button').disabled = !event.target.value.trim(); });
      $('composer').addEventListener('submit', async (event) => {
        event.preventDefault();
        const text = $('response').value;
        if (!text.trim() || !state.selectedId) return;
        $('send-button').disabled = true;
        $('send-status').className = 'send-status';
        $('send-status').textContent = 'Sending…';
        try {
          await api('/api/input', { method: 'POST', body: JSON.stringify({ sessionId: state.selectedId, text, submit: true }) });
          $('response').value = '';
          $('send-status').textContent = 'Sent';
          setTimeout(() => { if ($('send-status').textContent === 'Sent') $('send-status').textContent = ''; }, 1800);
          if (!state.liveStreaming) setTimeout(refreshPane, 350);
        } catch (error) {
          $('send-status').className = 'send-status error';
          $('send-status').textContent = error.message;
          $('send-button').disabled = false;
        }
      });
      window.addEventListener('popstate', (event) => { if (!event.state?.sessionId && state.selectedId) closeDetail(false); });
      window.addEventListener('beforeunload', stopPaneUpdates);
      window.addEventListener('keydown', (event) => {
        if ($('launch-overlay').hidden) return;
        if (event.key === 'Escape') {
          closeLaunchSheet();
          return;
        }
        if (event.key !== 'Tab') return;
        const focusable = [...$('launch-form').querySelectorAll(
          'button:not([disabled]), input:not([disabled]), textarea:not([disabled])'
        )].filter((element) => element.offsetParent !== null);
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable.at(-1);
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });

      updateLiveButton();
      bootstrapToken();
      if (state.token) {
        refreshBoard();
        state.boardTimer = setInterval(refreshBoard, 3000);
      }
    })();
  </script>
</body>
</html>
